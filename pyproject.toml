[project]
name = "agent-dispatch"
version = "0.1.0"
description = "Opens an agent session in a Herdr tab for each Soma task marked dispatch Requested, driven by an outbound long poll"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=25.1",
]

[project.scripts]
agent-dispatch = "agent_dispatch.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_dispatch"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
